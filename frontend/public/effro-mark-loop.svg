<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" fill="none" role="img" aria-label="Effro">
  <!-- Stem -->
  <path d="M 22 50 L 50 50"
        stroke="currentColor" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="30">
    <animate attributeName="stroke-dashoffset"
             values="30;0;0;-30;-30"
             keyTimes="0;0.2;0.65;0.85;1"
             keySplines="0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1; 0 0 1 1"
             calcMode="spline"
             dur="3s"
             repeatCount="indefinite"/>
  </path>
  <!-- Top branch — MINT -->
  <path d="M 50 50 Q 64 42, 78 22"
        stroke="#10B981" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="42">
    <animate attributeName="stroke-dashoffset"
             values="42;42;0;0;-42;-42"
             keyTimes="0;0.2;0.4;0.65;0.8;1"
             keySplines="0 0 1 1; 0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1; 0 0 1 1"
             calcMode="spline"
             dur="3s"
             repeatCount="indefinite"/>
  </path>
  <!-- Bottom branch -->
  <path d="M 50 50 Q 64 58, 78 78"
        stroke="currentColor" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="42">
    <animate attributeName="stroke-dashoffset"
             values="42;42;0;0;-42;-42"
             keyTimes="0;0.35;0.55;0.65;0.75;1"
             keySplines="0 0 1 1; 0.65 0 0.35 1; 0 0 1 1; 0.65 0 0.35 1; 0 0 1 1"
             calcMode="spline"
             dur="3s"
             repeatCount="indefinite"/>
  </path>
</svg>
