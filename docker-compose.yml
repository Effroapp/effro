version: "3.8"

services:
  app:
    build: .
    # Container name kept as `department-log` for backward compatibility
    # with existing `docker logs`/`docker exec` scripts. Image is `effro`
    # at the brand level.
    container_name: department-log
    ports:
      # Access the app at http://localhost:8080 (or your homelab hostname:8080)
      - "8080:8000"
    volumes:
      # All persistent data: SQLite database + uploaded files
      # Stored in ./data relative to this docker-compose.yml file
      - ./data:/data
    env_file:
      - .env
    environment:
      - DB_PATH=/data/department.db
      - UPLOAD_DIR=/data/uploads
      - FRONTEND_DIST=/app/frontend/dist
      # Hosted deployment -> authentication enforced (first run = setup page).
      - EFFRO_AUTH_ENABLED=true
      # ── Enterprise licence (OPT-IN) ──────────────────────────────────────
      # Leave OFF for self-hosted / Pro: the base image stays unlicensed and
      # fully writable. Enabling it WITHOUT a valid key puts the workspace in
      # read-only, so only switch it on for a provisioned enterprise instance.
      # Uncomment both, and supply the key via .env (EFFRO_LICENCE_KEY=...) or
      # mount a licence file and point EFFRO_LICENCE_FILE at it:
      #   - EFFRO_LICENCE_REQUIRED=true
      #   - EFFRO_LICENCE_KEY=${EFFRO_LICENCE_KEY}
      # Optionally pin the AI endpoint so it cannot be changed in-app:
      #   - EFFRO_AI_ENDPOINT=https://your-ai-gateway/v1
      # On first boot the one-time setup token is printed to the container
      # logs (docker logs department-log) - it is needed to create the admin.
    restart: unless-stopped
    healthcheck:
      # Use the public health probe: /api/areas now returns 401 under auth and
      # would wrongly mark the container unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
